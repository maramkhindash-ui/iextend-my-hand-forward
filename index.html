  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهارة التقليد - التصفيق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-btn:#5AC8FA;
    --sky-btn-deep:#2E9FD6;
    --leaf:#4CAF7D;
    --plum:#3A2E5C;
    --plum-soft:#6B5F8C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, #fff7e0 0%, transparent 40%),
      radial-gradient(circle at 92% 88%, #d9f3e6 0%, transparent 45%),
      linear-gradient(180deg, #EAF6FB 0%, #D6EEF9 100%);
    font-family:'Cairo', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 10px 20px;
  }
  .shell{ width:100%; max-width:760px; }

  /* ===== progress / step bar ===== */
  .stepbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    border-radius:20px;
    padding:14px 18px;
    margin-bottom:14px;
    box-shadow:0 8px 20px rgba(58,46,92,.08);
  }
  .step{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; flex:1;
  }
  .step-circle{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:#fff;
    background:#D9D2E8;
    transition: background .25s ease, transform .2s ease;
  }
  .step-label{ font-size:12px; font-weight:700; color:var(--plum-soft); }
  .step.done .step-circle{ background:var(--leaf); }
  .step.current .step-circle{ background:var(--sky-btn-deep); transform:scale(1.08); }
  .step.current .step-label{ color:var(--sky-btn-deep); }
  .step-line{ flex:0.6; height:3px; background:#E4DEF2; margin-top:-24px; }

  /* ===== page frames ===== */
  .pages{ position:relative; width:100%; }
  .pages iframe{
    width:100%;
    border:0;
    border-radius:24px;
    display:none;
    background:transparent;
    min-height:80vh;
  }
  .pages iframe.active{ display:block; }
</style>
</head>
<body>
<div class="shell">

  <div class="stepbar" id="stepbar">
    <div class="step" data-tab="1">
      <div class="step-circle">١</div>
      <div class="step-label">المعلومات والفيديو</div>
    </div>
    <div class="step-line"></div>
    <div class="step" data-tab="2">
      <div class="step-circle">٢</div>
      <div class="step-label">النشاط</div>
    </div>
    <div class="step-line"></div>
    <div class="step" data-tab="3">
      <div class="step-circle">٣</div>
      <div class="step-label">التقييم</div>
    </div>
  </div>

  <div class="pages">
    <iframe id="frame1"></iframe>
    <iframe id="frame2"></iframe>
    <iframe id="frame3"></iframe>
  </div>

</div>

<template id="tpl1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF6FB;
    --sky-deep:#D6EEF9;
    --orange:#FF9E44;
    --orange-deep:#F07C1E;
    --mango:#FFD166;
    --leaf:#4CAF7D;
    --leaf-deep:#379563;
    --plum:#3A2E5C;
    --plum-soft:#6B5F8C;
    --white:#FFFFFF;
    --red:#FF6F6F;
    --red-deep:#E24C4C;
    --sky-btn:#5AC8FA;
    --sky-btn-deep:#2E9FD6;
    --amber:#FFB84D;
    --amber-deep:#E0902C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, #fff7e0 0%, transparent 40%),
      radial-gradient(circle at 92% 88%, #d9f3e6 0%, transparent 45%),
      linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
    font-family:'Cairo', sans-serif;
    color:var(--plum);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 14px 50px;
  }
  h1,h2,h3{font-family:'Baloo Bhaijaan 2', sans-serif; margin:0;}

  .doc{
    width:100%;
    max-width:720px;
    background:var(--white);
    border-radius:28px;
    padding:30px 26px 34px;
    box-shadow:0 14px 0 rgba(58,46,92,.08), 0 20px 40px rgba(58,46,92,.10);
  }

  .eyebrow{
    display:inline-block;
    font-weight:700;
    color:var(--sky-btn-deep);
    background:#E4F6FF;
    padding:6px 16px;
    border-radius:999px;
    font-size:13.5px;
    margin-bottom:12px;
  }
  .doc-title{ font-size:26px; font-weight:800; margin-bottom:10px; line-height:1.5; }
  .doc-lead{
    font-size:16px;
    color:var(--plum-soft);
    line-height:1.9;
    margin-bottom:26px;
  }

  h2.section-title{
    font-size:20px;
    font-weight:800;
    color:var(--plum);
    margin:34px 0 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h2.section-title .num{
    flex-shrink:0;
    width:32px; height:32px;
    border-radius:10px;
    background:linear-gradient(180deg, #7ED9F7, var(--sky-btn));
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    font-weight:800;
  }

  .benefit-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:6px;
  }
  .benefit-item{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:#F7F5FF;
    border-radius:16px;
    padding:14px 16px;
  }
  .benefit-icon{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:12px;
    background:linear-gradient(180deg, #7ED9F7, var(--sky-btn));
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
  }
  .benefit-text strong{ display:block; font-size:15px; color:var(--plum); margin-bottom:3px; }
  .benefit-text span{ font-size:14px; color:var(--plum-soft); line-height:1.75; }

  .prep-box{
    background:#FFF7E9;
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:18px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .prep-box .tag{
    flex-shrink:0;
    background:var(--mango);
    color:var(--plum);
    font-weight:800;
    padding:3px 12px;
    border-radius:999px;
    font-size:12.5px;
  }
  .prep-box p{ margin:0; font-size:14px; color:var(--plum-soft); line-height:1.85; }

  /* prompt ladder */
  .ladder{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:8px;
  }
  .step-card{
    display:flex;
    gap:14px;
    align-items:flex-start;
    border-radius:18px;
    padding:16px 18px;
    border:2px solid #EEE9FA;
    position:relative;
  }
  .step-badge{
    flex-shrink:0;
    width:42px; height:42px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800;
    font-size:17px;
    color:#fff;
  }
  .step1 .step-badge{ background:linear-gradient(180deg, #FF8A8A, var(--red-deep)); }
  .step2 .step-badge{ background:linear-gradient(180deg, #FFB07A, var(--orange-deep)); }
  .step3 .step-badge{ background:linear-gradient(180deg, #FFD08A, var(--amber)); }
  .step4 .step-badge{ background:linear-gradient(180deg, #7ED9F7, var(--sky-btn)); }
  .step5 .step-badge{ background:linear-gradient(180deg, #7EE0A8, var(--leaf)); }

  .step-body strong{ display:block; font-size:15.5px; color:var(--plum); margin-bottom:4px; }
  .step-body span{ font-size:14px; color:var(--plum-soft); line-height:1.8; display:block; }
  .step-body .example{
    margin-top:6px;
    font-size:13px;
    color:var(--plum-soft);
    background:#F7F5FF;
    border-radius:10px;
    padding:8px 12px;
    display:inline-block;
  }

  .arrow-down{
    text-align:center;
    color:var(--plum-soft);
    font-size:20px;
    margin:-4px 0;
  }

  .rule-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:14px 0 6px;
  }
  .rule-item{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:14.5px;
    color:var(--plum-soft);
    line-height:1.8;
  }
  .rule-item .check{
    flex-shrink:0;
    color:var(--leaf-deep);
    font-weight:800;
  }

  .reinforce-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:16px 0 6px;
  }
  .reinforce-card{
    background:#F0FBF4;
    border-radius:16px;
    padding:14px 16px;
    text-align:right;
  }
  .reinforce-card strong{ display:block; font-size:14.5px; color:var(--leaf-deep); margin-bottom:5px; }
  .reinforce-card span{ font-size:13px; color:var(--plum-soft); line-height:1.75; }

  .caution-box{
    background:#FFF1F0;
    border-radius:16px;
    padding:16px 18px;
    margin-top:20px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .caution-box .tag{
    flex-shrink:0;
    background:var(--red);
    color:#fff;
    font-weight:800;
    padding:3px 12px;
    border-radius:999px;
    font-size:12.5px;
  }
  .caution-box p{ margin:0; font-size:14px; color:var(--plum-soft); line-height:1.85; }

  .closing{
    margin-top:28px;
    background:linear-gradient(135deg, #FFF7E9, #EAF6FB);
    border-radius:18px;
    padding:20px 20px;
    text-align:center;
  }
  .closing strong{ display:block; font-size:16.5px; color:var(--plum); margin-bottom:6px; }
  .closing span{ font-size:14px; color:var(--plum-soft); line-height:1.85; }

  @media (max-width:520px){
    .reinforce-grid{ grid-template-columns:1fr; }
    .doc{ padding:22px 18px 28px; }
  }

  /* ===== video CTA section ===== */
  .video-cta{ margin-top:32px; text-align:center; }
  .video-btn{
    background:linear-gradient(180deg, #7ED9F7, var(--sky-btn));
    color:#fff; font-family:'Baloo Bhaijaan 2', sans-serif; font-weight:800;
    font-size:17px; padding:15px 34px; border:none; border-radius:100px;
    cursor:pointer; box-shadow:0 10px 22px rgba(46,159,214,.35);
    display:inline-flex; align-items:center; gap:9px;
    transition: transform .15s ease;
  }
  .video-btn:active{ transform:scale(.96); }
  .video-section{ display:none; margin-top:22px; }
  .video-section.show{ display:block; animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .video-frame-wrap{
    position:relative; width:100%; padding-bottom:56.25%;
    border-radius:18px; overflow:hidden;
    box-shadow:0 10px 24px rgba(58,46,92,.15);
  }
  .video-frame-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-link-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    margin-top:12px; padding:10px 14px; background:#E4F6FF; border-radius:12px;
    font-size:13.5px; color:var(--plum-soft); direction:ltr; justify-content:center;
  }
  .video-link-row span{ direction:rtl; color:var(--plum); font-weight:700; }
  .video-link-row a{ color:var(--sky-btn-deep); font-weight:700; word-break:break-all; text-decoration:underline; }
  .tip-list{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
  .tip-item{ display:flex; align-items:flex-start; gap:12px; background:#F7F5FF; border-radius:16px; padding:14px 16px; }
  .tip-icon{
    flex-shrink:0; width:38px; height:38px; border-radius:12px;
    background:linear-gradient(180deg, #7ED9F7, var(--sky-btn));
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .tip-text{ font-size:14px; color:var(--plum-soft); line-height:1.8; padding-top:6px; }

  /* ===== page nav ===== */
  .page-nav{ margin-top:30px; display:flex; justify-content:center; }
  .nav-btn{
    font-family:'Baloo Bhaijaan 2', sans-serif; font-weight:800; font-size:15px;
    padding:13px 30px; border-radius:100px; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; transition: transform .15s ease;
  }
  .nav-btn:active{ transform:scale(.96); }
  .nav-btn.next{ background:var(--leaf); color:#fff; box-shadow:0 8px 18px rgba(76,175,125,.35); }
</style>


<div class="doc">
  <span class="eyebrow">دليل للأهل</span>
  <h1 class="doc-title">أهمية مهارة التقليد (زي مد يدك إلى الامام) وطريقة تعليمها للطفل خطوة بخطوة</h1>
  <p class="doc-lead">التقليد من أبسط المهارات وأهمّها في نفس الوقت. تعلّم حركة بسيطة زي مد يدك إلى الامام مش بس "لعبة" — هو تمرين خفي على الانتباه، التواصل، والاستعداد للكلام لاحقًا. هذا الدليل يشرح ليش التقليد مهم، وكيف تطبّقون النشاط بمساعدة كاملة بالبداية، ثم تقللون المساعدة تدريجيًا لحد ما يصير الطفل مستقل، مع أهمية التعزيز المناسب في كل خطوة.</p>

  <!-- ===== SECTION 1: WHY IMITATION MATTERS ===== -->
  <h2 class="section-title"><span class="num">١</span> ليش التقليد مهم لطفلكم؟</h2>
  <div class="benefit-list">
    <div class="benefit-item">
      <div class="benefit-icon">🧩</div>
      <div class="benefit-text">
        <strong>حجر الأساس للتعلّم الاجتماعي</strong>
        <span>الطفل يتعلم أغلب مهاراته (الكلام، اللعب، التفاعل) بالبداية عن طريق تقليد من حوله، قبل ما يقدر يبتكر بنفسه.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">👀</div>
      <div class="benefit-text">
        <strong>يبني التواصل البصري والانتباه المشترك</strong>
        <span>عشان يقلّد حركة زي مد يدك إلى الامام، لازم ينتبه لوجه ويدين الشخص المقابل له، وهذا يدرّبه على التركيز مع الآخرين.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">🗣️</div>
      <div class="benefit-text">
        <strong>يمهّد للكلام</strong>
        <span>تقليد الحركات البسيطة (تصفيق، تلويح، إشارة) خطوة قبل تقليد الأصوات والكلمات؛ الطفل يلي يقدر يقلّد حركة غالبًا بيوصل أسرع لتقليد كلمة.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">🌟</div>
      <div class="benefit-text">
        <strong>يعزّز الثقة والمشاركة</strong>
        <span>كل مرة يقلّد فيها بنجاح ويشوف ردة فعل إيجابية، يحس بإنجاز، وهذا يشجعه يكرر ويجرب أكثر.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">🤝</div>
      <div class="benefit-text">
        <strong>أساس للعب التبادلي</strong>
        <span>الألعاب الاجتماعية البسيطة (مثل "بيني بيني" أو الاستغماية) مبنية على تقليد وانتظار الدور، وده يهيّئه للعب مع أطفال ثانيين لاحقًا.</span>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon">🔁</div>
      <div class="benefit-text">
        <strong>سهلة التدريب واليومية</strong>
        <span>عكس المهارات المعقدة، حركات زي مد يدك إلى الامام تقدرون تكرروها بسهولة في أي وقت (أغنية، لعبة، وداع)، فتتكرر التجربة بشكل طبيعي بدون ضغط.</span>
      </div>
    </div>
  </div>

  <!-- ===== SECTION 2: HOW TO APPLY ===== -->
  <h2 class="section-title"><span class="num">٢</span> طريقة تطبيق النشاط: من المساعدة الكاملة إلى الاستقلالية</h2>

  <div class="prep-box">
    <span class="tag">قبل البدء</span>
    <p>اجلسوا وجهًا لوجه مع الطفل بمستوى نظره، اختاروا وقت هادئ يكون فيه منتبه (مو متعب أو جوعان)، وتأكدوا من وجود تواصل بصري بسيط قبل إعطاء أي تلميح.</p>
  </div>

  <div class="ladder">
    <div class="step-card step1">
      <div class="step-badge">١</div>
      <div class="step-body">
        <strong>المساعدة الكاملة (مساعدة جسدية كاملة)</strong>
        <span>تمسكون يدي الطفل بلطف وتصفّقون معه فعليًا وأنتم تقولون "صفّق!". هذا المستوى يضمن نجاح الطفل ١٠٠٪، وهو نقطة البداية الآمنة.</span>
        <span class="example">مثال: "يلا نصفّق سوا! 👏" (وأنتم تحركون يديه)</span>
      </div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="step-card step2">
      <div class="step-badge">٢</div>
      <div class="step-body">
        <strong>المساعدة الجزئية (لمسة خفيفة)</strong>
        <span>تلمسون يديه بلطف بدون ما تحركوها بالكامل — فقط توجيه بسيط، وتنتظرون هو يكمل الحركة بنفسه.</span>
      </div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="step-card step3">
      <div class="step-badge">٣</div>
      <div class="step-body">
        <strong>النموذج البصري (تقليد بدون لمس)</strong>
        <span>تصفّقون أنتم أمامه بوضوح بدون أي لمس له، وتنتظرون يلاحظ ويقلّد الحركة بنفسه.</span>
      </div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="step-card step4">
      <div class="step-badge">٤</div>
      <div class="step-body">
        <strong>التلميح اللفظي فقط</strong>
        <span>تقولون "صفّق!" بدون ما تصفّقوا أنتم، وتعطونه وقت (٣-٥ ثواني) عشان يستجيب لوحده.</span>
      </div>
    </div>

    <div class="arrow-down">⬇</div>

    <div class="step-card step5">
      <div class="step-badge">٥</div>
      <div class="step-body">
        <strong>الاستقلالية الكاملة</strong>
        <span>يصفّق من تلقاء نفسه في الموقف المناسب (أغنية، فرح، نجاح) بدون أي تلميح منكم — هذا الهدف النهائي.</span>
      </div>
    </div>
  </div>

  <h2 class="section-title"><span class="num">٣</span> كيف تنتقلون بين المستويات (تقليل المساعدة تدريجيًا)</h2>
  <div class="rule-list">
    <div class="rule-item"><span class="check">✓</span><span>ابدأوا دايمًا بالمستوى اللي يضمن نجاح الطفل، حتى لو كان مساعدة كاملة — النجاح المتكرر هو اللي يبني الثقة.</span></div>
    <div class="rule-item"><span class="check">✓</span><span>انتقلوا للمستوى الأقل مساعدة فقط بعد ما يثبت الطفل النجاح ٣-٥ مرات متتالية بالمستوى الحالي.</span></div>

const TOTAL_LEVELS = 5;
const STREAK_TARGET = 5;
const AR_NUMS = ['','١','٢','٣','٤','٥'];
const STORAGE_KEY = 'imitateExtendLevel';

/* ---------- elements ---------- */
const sceneImg          = document.getElementById('sceneImg');
const specialistHit      = document.getElementById('specialistHit');
const pointHint          = document.getElementById('pointHint');
const specialistClapImg  = document.getElementById('specialistClapImg');
const clapAudio          = document.getElementById('clapAudio');
const chairZone          = document.getElementById('chairZone');
const seatedImg          = document.getElementById('seatedImg');
const taskArea           = document.getElementById('taskArea');
const tray               = document.getElementById('tray');
const feedback           = document.getElementById('feedback');
const levelNextControls  = document.getElementById('levelNextControls');
const levelNextBtn       = document.getElementById('levelNextBtn');
const resetControls      = document.getElementById('resetControls');
const resetBtn           = document.getElementById('resetBtn');
const instructionItems   = document.querySelectorAll('.instructions li');
const levelRow           = document.getElementById('levelRow');
const levelCaption       = document.getElementById('levelCaption');
const streakRow          = document.getElementById('streakRow');

sceneImg.src = ASSETS.scene;
specialistClapImg.src = ASSETS.specialistExtend;
clapAudio.src = ASSETS.extendAudio;

/* ---------- persistence (resume at the level where the child stopped) ---------- */
function loadLevel(){
  try{
    const v = window.localStorage.getItem(STORAGE_KEY);
    const n = parseInt(v, 10);
    if(n >= 1 && n <= TOTAL_LEVELS) return n;
  }catch(e){ /* storage unavailable — fall back to level 1 */ }
  return 1;
}
function saveLevel(n){
  try{ window.localStorage.setItem(STORAGE_KEY, String(n)); }catch(e){ /* ignore */ }
}

let level = loadLevel();
let streak = 0;
let hasStarted = false;
let roundLocked = false;

/* ---------- level dots + streak pips ---------- */
function renderLevels(){
  levelRow.innerHTML = '';
  for(let i=1;i<=TOTAL_LEVELS;i++){
    const d = document.createElement('div');
    d.className = 'level-dot' + (i < level ? ' done' : (i === level ? ' current' : ''));
    levelRow.appendChild(d);
  }
  levelCaption.textContent = `المستوى ${AR_NUMS[level]} من ٥`;
}
function renderStreak(){
  streakRow.innerHTML = '';
  for(let i=1;i<=STREAK_TARGET;i++){
    const p = document.createElement('div');
    p.className = 'streak-pip' + (i <= streak ? ' filled' : '');
    p.textContent = i <= streak ? '✓' : '';
    streakRow.appendChild(p);
  }
}

/* ---------- instruction step highlight ---------- */
function setStep(n){
  instructionItems.forEach(li => {
    const s = parseInt(li.dataset.step,10);
    li.classList.toggle('done', s < n);
    li.classList.toggle('current', s === n);
    li.classList.toggle('upcoming', s > n);
  });
}

/* ---------- speech (fixed phrases) ---------- */
let arVoice = null;
function pickVoice(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  arVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar')) || null;
}
if(window.speechSynthesis){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA';
  if(arVoice) u.voice = arVoice;
  u.rate = 0.95; u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

/* ---------- start a fresh level ---------- */
function startLevel(){
  hasStarted = false;
  roundLocked = false;
  streak = 0;
  specialistClapImg.classList.remove('show');
  pointHint.classList.remove('hidden');
  chairZone.classList.remove('enabled');
  seatedImg.classList.remove('show');
  seatedImg.src = '';
  taskArea.classList.add('hidden');
  tray.innerHTML = '';
  feedback.className = 'feedback';
  feedback.textContent = '';
  levelNextControls.classList.add('hidden');
  resetControls.classList.add('hidden');
  renderLevels();
  renderStreak();
  setStep(1);
}
startLevel();

/* ---------- click specialist: clap + auto-start drag phase ---------- */
specialistHit.addEventListener('click', () => {
  specialistClapImg.classList.add('show');
  clapAudio.currentTime = 0;
  clapAudio.play().catch(()=>{});
  pointHint.classList.add('hidden');
  if(!hasStarted){
    hasStarted = true;
    setStep(2);
    setTimeout(() => {
      chairZone.classList.add('enabled');
      taskArea.classList.remove('hidden');
      buildTray();
    }, 650);
  }
});

/* ---------- shuffle + build a trial's choices ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildTray(){
  roundLocked = false;
  feedback.className = 'feedback';
  feedback.textContent = '';
  seatedImg.classList.remove('show');

  const extendItem = { key:'extend', src:ASSETS.boyExtend, label:'يمد يده مثلها 👊', correct:true };
  const kickItem   = { key:'kick',   src:ASSETS.boyKick,   label:'يركل الكرة ⚽', correct:false };
  const iceItem    = { key:'ice',    src:ASSETS.boyIce,    label:'يأكل آيس كريم 🍦', correct:false };

  let pool;
  if(level === 1){
    const distractor = Math.random() < 0.5 ? kickItem : iceItem;
    pool = [extendItem, distractor];
  } else {
    pool = [extendItem, kickItem, iceItem];
  }
  const items = shuffle(pool);

  tray.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'choice';
    el.dataset.correct = item.correct ? '1' : '0';
    el.innerHTML = `<img src="${item.src}" alt="${item.label}"><div class="choice-label">${item.label}</div>`;
    tray.appendChild(el);
    makeDraggable(el);
  });
}

function makeDraggable(el){
  let startX, startY, origX, origY, dragging = false;

  el.addEventListener('pointerdown', (e) => {
    if(roundLocked) return;
    dragging = true;
    el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    origX = r.left; origY = r.top;
    el.style.position = 'fixed';
    el.style.width = r.width + 'px';
    el.style.left = r.left + 'px';
    el.style.top = r.top + 'px';
    el.style.margin = '0';
    el.classList.add('dragging');
  });

  el.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    el.style.left = (origX + dx) + 'px';
    el.style.top = (origY + dy) + 'px';
    chairZone.classList.toggle('drag-over', overlaps(el, chairZone));
  });

  function endDrag(){
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    const hit = overlaps(el, chairZone);
    chairZone.classList.remove('drag-over');
    if(hit){
      handleDrop(el);
    } else {
      el.style.position=''; el.style.left=''; el.style.top=''; el.style.width=''; el.style.margin='';
    }
  }
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}

function overlaps(a, b){
  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();
  return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
}

function handleDrop(el){
  const isCorrect = el.dataset.correct === '1';
  if(isCorrect){
    roundLocked = true;
    el.classList.add('correct-hide');
    el.style.position=''; el.style.left=''; el.style.top=''; el.style.width=''; el.style.margin='';

    seatedImg.src = ASSETS.boySeatedExtend;
    requestAnimationFrame(()=> seatedImg.classList.add('show'));

    streak += 1;
    renderStreak();

    feedback.textContent = 'ممتاز! 🎉';
    feedback.className = 'feedback show good';
    speak('ممتاز');
    burstConfetti();

    if(streak >= STREAK_TARGET){
      // level complete
      setStep(3);
      taskArea.classList.add('hidden');
      chairZone.classList.remove('enabled');
      setTimeout(() => {
        if(level >= TOTAL_LEVELS){
          setStep(4);
          resetControls.classList.remove('hidden');
        } else {
          levelNextControls.classList.remove('hidden');
        }
      }, 1200);
    } else {
      // auto-continue: same level, new trial
      setTimeout(() => {
        buildTray();
      }, 1300);
    }
  } else {
    el.style.position=''; el.style.left=''; el.style.top=''; el.style.width=''; el.style.margin='';
    el.classList.add('wrong-shake');
    setTimeout(()=> el.classList.remove('wrong-shake'), 460);
    feedback.textContent = 'حاول مرة أخرى 💪';
    feedback.className = 'feedback show bad';
    speak('حاول مرة أخرى');
  }
}

/* ---------- confetti ---------- */
function burstConfetti(){
  const colors = ['#F2B84B','#4E7FA6','#6FA88F','#EE8C6E'];
  for(let i=0;i<22;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const size = 6 + Math.random()*6;
    p.style.width = size+'px';
    p.style.height = (size*1.4)+'px';
    p.style.left = (Math.random()*100)+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.6 + Math.random()*1.2)+'s';
    document.body.appendChild(p);
    setTimeout(()=> p.remove(), 3000);
  }
}

/* ---------- go to next level ---------- */
levelNextBtn.addEventListener('click', () => {
  if(level < TOTAL_LEVELS){
    level += 1;
    saveLevel(level);
    startLevel();
  }
});

/* ---------- reset whole activity ---------- */
resetBtn.addEventListener('click', () => {
  level = 1;
  saveLevel(level);
  startLevel();
});

/* ---------- page-level navigation ---------- */
document.getElementById('toCardBtn').addEventListener('click', () => {
  window.parent.postMessage({ type:'navigate', tab:1 }, '*');
});
document.getElementById('toEvalBtn').addEventListener('click', () => {
  window.parent.postMessage({ type:'navigate', tab:3 }, '*');
});

/* ---------- allow the evaluation page's "repeat activity" button to reset this activity ---------- */
window.resetActivityExternal = function(){
  level = 1;
  saveLevel(level);
  startLevel();
};
window.addEventListener('message', (e) => {
  if(e.data && e.data.type === 'resetActivity'){
    window.resetActivityExternal();
  }
});
</script>

<script>
  function buildDoc(tplId){
    var tpl = document.getElementById(tplId);
    var inner = tpl.innerHTML;
    return '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
      '<style>html,body{margin:0;padding:0;}</style></head><body>' + inner + '</body></html>';
  }

  var frames = {
    1: document.getElementById('frame1'),
    2: document.getElementById('frame2'),
    3: document.getElementById('frame3')
  };
  var loaded = { 1:false, 2:false, 3:false };
  var maxReached = 1;

  function ensureLoaded(n){
    if(!loaded[n]){
      frames[n].srcdoc = buildDoc('tpl' + n);
      loaded[n] = true;
    }
  }

  function resizeFrame(n){
    try{
      var doc = frames[n].contentWindow.document;
      var h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
      frames[n].style.height = (h + 20) + 'px';
    }catch(e){}
  }

  function updateStepbar(n){
    document.querySelectorAll('.step').forEach(function(el){
      var t = parseInt(el.dataset.tab, 10);
      el.classList.toggle('current', t === n);
      el.classList.toggle('done', t < n || (t <= maxReached && t !== n));
    });
  }

  function showTab(n){
    if(n > maxReached) maxReached = n;
    ensureLoaded(n);
    Object.keys(frames).forEach(function(k){
      frames[k].classList.toggle('active', parseInt(k,10) === n);
    });
    updateStepbar(n);
    setTimeout(function(){ resizeFrame(n); }, 350);
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  document.querySelectorAll('.step').forEach(function(el){
    el.addEventListener('click', function(){
      var t = parseInt(el.dataset.tab, 10);
      if(t <= maxReached){ showTab(t); }
    });
  });

  window.addEventListener('message', function(e){
    if(!e.data) return;
    if(e.data.type === 'navigate'){
      showTab(e.data.tab);
    }
    if(e.data.type === 'resetActivity'){
      ensureLoaded(2);
      frames[2].contentWindow.postMessage({ type:'resetActivity' }, '*');
      showTab(2);
    }
  });

  window.addEventListener('load', function(){
    for(var i=1;i<=3;i++){
      (function(n){
        frames[n].addEventListener('load', function(){ resizeFrame(n); });
      })(i);
    }
    showTab(1);
  });
</script>
